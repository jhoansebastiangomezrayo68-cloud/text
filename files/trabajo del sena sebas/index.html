<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" href="./img/favicon.png" type="image/png">
  <!-- Link to the external CSS file -->
  <link rel="stylesheet" href="./styles.css">

  <title>Login</title>
</head>

<body>
  <!-- Preloader -->
  <div class="preloader" id="preloader">
    <div class="spinner">Cargando...</div>
  </div>
  <!-- Header -->
  <header>
    <h1>Login </h1>
    <button class="toggle-button" id="toggle-button">☰</button>
    <nav>
      <ul>
        <li><a href="#">Home</a></li>
        <li><a href="#">About</a></li>
        <li><a href="#">Contact</a></li>
      </ul>
    </nav>
  </header>
  <!-- Main content -->
  <div class="login-container">
    <form action="/login" method="POST">
      <div class="validation-message" id="validation-message"></div>
      <label for="username">Username:</label>
      <input type="text" id="username" name="username" pattern="^[a-zA-Z0-9_]{4,20}$"
        title="Debe tener 4-20 caracteres, solo letras, números y guiones bajos" placeholder="Username" required>

  <!-- Campo de Password -->
  <div class="form-group">
    <label for="password">Password:</label>
    <input type="password" id="password" name="password" placeholder="Password">
  </div>

  <!-- Enlace para recuperar contraseña -->
  <div class="forgot-password">
    <a href="#">¿Olvidaste tu contraseña?</a>
  </div>
  <!-- Botón Login -->
  <button type="submit" class="btn-login">Login</button>

  <!-- Enlace de Registro -->
  <div class="register-link">
    <p>¿No tienes una cuenta? <a href="registro.html">Regístrate aquí</a></p>
  </div>
  </form>
  </div>

  <footer>
    <p>&copy; 2024 Your Company. All rights reserved.</p>
  </footer>
  <!-- Include the main.js script   -->
  <script src="main.js"></script>
  <script src="assets/js/main.js"></script>
</body>

</html>
